<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap');
:root {
  --bg:#0E1318; --panel:#161D26; --card:#1B2430; --border:#26323E;
  --text:#E7EEF6; --muted:#8CA0B4; --accent:#3DDC97; --accent-strong:#2BBD81;
  --accent-soft:#3DDC97; --amber:#FFB84D; --red:#FF6B7A; --green:#3DDC97;
  --accent-bg:rgba(61,220,151,.12); --amber-bg:rgba(255,184,77,.12); --red-bg:rgba(255,107,122,.12);
  --icon-bg:rgba(255,255,255,.07); --hstat-bg:rgba(255,255,255,.05);
  --header-bg:linear-gradient(180deg,#141C26,#0E1318); --modal-bg:#141C26;
  --overlay:rgba(0,0,0,.55); --scrollbar:#33404E; --accent-ink:#06211A;
  --accent-border:rgba(61,220,151,.3); --nav-bg:rgba(20,28,38,.92); --nav-shadow:rgba(0,0,0,.5);
  --danger-text:#C0483F; --hint:#8A9A96; --ok-ink:#3DDC97;
}
html[data-theme="light"] {
  --bg:#EFF4F1; --panel:#FFFFFF; --card:#FFFFFF; --border:#DFE9E3;
  --text:#17332B; --muted:#789189; --accent:#0FA67A; --accent-strong:#089A6E;
  --accent-soft:#7FE3C1; --amber:#A9701F; --red:#E4556D; --green:#0FA67A;
  --accent-bg:rgba(14,170,120,.13); --amber-bg:rgba(201,134,43,.15); --red-bg:rgba(228,85,109,.12);
  --icon-bg:rgba(23,59,46,.08); --hstat-bg:rgba(23,59,46,.05);
  --header-bg:linear-gradient(180deg,#FFFFFF,#F2F7F4); --modal-bg:#FFFFFF;
  --overlay:rgba(20,50,40,.4); --scrollbar:#C9D8D0; --accent-ink:#FFFFFF;
  --accent-border:rgba(14,170,120,.35); --nav-bg:rgba(255,255,255,.94); --nav-shadow:rgba(20,60,45,.18);
  --danger-text:#C0392B; --hint:#789189; --ok-ink:#0B6E4F;
}
* { box-sizing:border-box; font-family:'Tajawal',sans-serif; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); }
body, .header, .bottom-nav, .modal-card, .client-card, .stat-card, .date-bar, .search-row, .select-field, .h-stat, .theme-toggle, .avatar, .collected-pill, .pending-pill, .quick-btn, .send-btn, .icon-btn, .icon-btn-danger { transition:background-color .25s ease, border-color .25s ease, color .25s ease; }
input,select,button { font-family:'Tajawal',sans-serif; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:4px; }
button { cursor:pointer; transition:transform .12s ease, opacity .12s ease; }
button:active { transform:scale(.95); }
a:active { transform:scale(.95); }
input:focus, select:focus, button:focus { outline:2px solid var(--accent); outline-offset:1px; }
.app-shell { max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
.body { flex:1; padding:12px 12px 104px 12px; overflow-y:auto; animation:fadeSlideIn .25s ease; }
.header { background:var(--header-bg); padding:14px 14px 16px; border-bottom:1px solid var(--border); }
.theme-toggle { border:none; background:var(--icon-bg); color:var(--text); border-radius:10px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.header-top { display:flex; align-items:center; gap:10px; }
.brand-logo { width:34px; height:34px; border-radius:10px; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
.brand-title { font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; color:var(--text); }
.brand-sub { font-size:11px; color:var(--muted); margin-top:2px; }
.header-alert { border:none; background:var(--amber-bg); color:var(--amber); border-radius:999px; padding:6px 10px; font-size:11px; font-weight:800; white-space:nowrap; }
.h-stats { display:flex; gap:8px; margin-top:12px; }
.h-stat { flex:1; background:var(--hstat-bg); border-radius:12px; padding:8px 10px; text-align:center; border:1px solid var(--border); }
.h-stat-label { font-size:10px; color:var(--muted); }
.h-stat-value { font-size:13.5px; font-weight:800; color:var(--text); margin-top:2px; }
.h-stat.ok .h-stat-value { color:var(--accent); }
.h-stat.warn .h-stat-value { color:var(--amber); }
.date-bar { display:flex; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:8px 10px; margin-bottom:10px; }

.date-input { border:none; font-size:14px; font-weight:700; text-align:center; background:transparent; color:var(--text); }
.date-human { font-size:11.5px; color:var(--muted); margin-top:2px; }
.stats-row { display:flex; gap:8px; margin-bottom:10px; }

.stat-label { font-size:12px; color:var(--muted); }

.search-row { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:8px 12px; }

.segment-row { display:flex; gap:6px; margin-bottom:4px; }
.segment-btn { flex:1; padding:8px 0; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:12.5px; }
.segment-btn-active { flex:1; padding:8px 0; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-size:12.5px; font-weight:800; }

.location-btn { width:100%; margin-top:6px; background:var(--panel); color:var(--accent); border:1.5px dashed var(--accent-border); border-radius:10px; padding:9px 0; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; }
.tour-btn { width:100%; margin-top:8px; background:var(--accent-bg); color:var(--accent); border:1px solid var(--accent-border); border-radius:10px; padding:9px 0; font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:6px; }
.client-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 12px; animation:fadeSlideIn .3s ease; }
.client-card-top { display:flex; gap:10px; align-items:flex-start; }
.avatar { width:38px; height:38px; border-radius:11px; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.client-info { flex:1; min-width:0; }
.client-store { font-weight:800; font-size:10.5px; color:var(--accent); background:var(--accent-bg); display:inline-block; padding:2px 8px; border-radius:999px; margin-bottom:3px; }

.phone-row { display:flex; align-items:center; gap:6px; margin-top:2px; }
.phone-action { border:none; background:var(--icon-bg); color:var(--text); border-radius:7px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; text-decoration:none; }

.icon-btn-danger { border:none; background:var(--red-bg); border-radius:8px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--red); }

.empty-state { text-align:center; color:var(--muted); font-size:13px; padding:30px 10px; }

@keyframes fadeSlideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes overlayFadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes modalSlideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

<script>
/* ---------------- Lazy-load XLSX library only when actually needed ---------------- */
let xlsxLoadPromise = null;
function ensureXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { xlsxLoadPromise = null; reject(new Error('تعذر تحميل مكتبة الإكسيل')); };
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}

/* ---------------- Helpers ---------------- */
function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function yearNum(){ return new Date().getFullYear(); }
const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fmtDateHuman(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtMoney(n){
  const num = Number(n) || 0;
  return num.toLocaleString('ar-EG', {maximumFractionDigits: 2}) + ' ج.م';
}
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Theme (Day / Night) ---------------- */
function getTheme(){ return localStorage.getItem('tahseel-theme') || 'dark'; }
function applyTheme(t){
  try { localStorage.setItem('tahseel-theme', t); } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0E1318' : '#0FA67A');
}
function toggleTheme(){ applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); render(); }

function avGrad(id){
  const s = String(id || 'x');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const hue = h % 360;
  return 'linear-gradient(135deg,hsl(' + hue + ',62%,50%),hsl(' + ((hue + 40) % 360) + ',62%,36%))';
}
function initials(name){
  const parts = String(name || '').trim().split(/\s+/);
  return esc((parts[0] ? parts[0][0] : '؟') + (parts[1] ? parts[1][0] : ''));
}

/* ---------------- Derived data ---------------- */
function getDayTx(){ return transactions.filter(t => t.date === selectedDate); }
function txPaid(t){ return Number(t.paid) || 0; }
function txPending(t){ return t.amountSent - txPaid(t); }
function computeStats(txs){
  const total = txs.reduce((s,t) => s + t.amountSent, 0);
  const collected = txs.reduce((s,t) => s + txPaid(t), 0);
  const pending = total - collected;
  const pct = total > 0 ? Math.round(collected/total*100) : 0;
  return {total, collected, pending, pct, count: txs.length};
}
function sortedClients(){ return clients.slice().sort((a,b) => a.name.localeCompare(b.name,'ar')); }
function sortedAreas(){ return areas.slice().sort((a,b) => a.name.localeCompare(b.name,'ar')); }
function clientPendingTotal(clientId){
  return transactions.filter(t => t.clientId === clientId).reduce((s,t) => s + txPending(t), 0);
}
function buildOverdueBadge(c){
  const pend = clientPendingTotal(c.id);
  return pend > 0 ? '<div class="client-meta" style="color:var(--danger-text);font-weight:700">⚠️ متأخر عليه: ' + fmtMoney(pend) + '</div>' : '';
}
function filteredClientList(){
  const list = clients.filter(c =>
    (c.name.includes(search) || (c.storeName||'').includes(search) || (c.location||'').includes(search) || (c.address||'').includes(search) || (c.machineNumber||'').includes(search)) &&
    (areaFilter === 'all' || c.location === areaFilter) &&
    (!onlyDebtors || clientPendingTotal(c.id) > 0)
  );
  return sortByProximityOrName(list);
}
function sortByProximityOrName(list){
  if (!myLocation) return list.slice().sort((a,b) => a.name.localeCompare(b.name,'ar'));
  const withLoc = list.filter(c => c.lat != null && c.lng != null);
  const withoutLoc = list.filter(c => c.lat == null || c.lng == null);
  withLoc.sort((a,b) => distanceKm(myLocation, {lat:a.lat,lng:a.lng}) - distanceKm(myLocation, {lat:b.lat,lng:b.lng}));
  withoutLoc.sort((a,b) => a.name.localeCompare(b.name,'ar'));
  return withLoc.concat(withoutLoc);
}

function captureLocation(){
  if (!navigator.geolocation) { alert('المتصفح ده مش بيدعم تحديد الموقع'); return; }
  const btn = document.getElementById('location-btn');
  if (btn) btn.textContent = '⏳ جاري تحديد الموقع...';

    },
    () => {
      alert('تعذر تحديد الموقع. تأكد إن صلاحية الموقع مفعّلة للمتصفح وجرّب تاني.');
      if (btn) btn.textContent = '📍 سجّل موقعي الحالي';
    },
    {enableHighAccuracy: true, timeout: 15000}
  );
}
function distanceKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function nearestNeighborOrder(start, list){
  const remaining = list.slice();
  const ordered = [];
  let current = start;
  while (remaining.length) {
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((c, i) => {
      const d = distanceKm(current, {lat: c.lat, lng: c.lng});
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    ordered.push(next);
    current = {lat: next.lat, lng: next.lng};
  }
  return ordered;
}
function openMapsRoute(ordered){
  const CHUNK = 9; // أقصى عدد محطات تقريبي مدعوم في رابط جوجل ماب الواحد
  for (let i = 0; i < ordered.length; i += CHUNK) {
    const chunk = ordered.slice(i, i + CHUNK);
    const dest = chunk[chunk.length - 1];
    const waypoints = chunk.slice(0, -1).map(c => c.lat + ',' + c.lng).join('|');
    let url = 'https://www.google.com/maps/dir/?api=1&destination=' + dest.lat + ',' + dest.lng;
    if (waypoints) url += '&waypoints=' + encodeURIComponent(waypoints);
    url += '&travelmode=driving';
    window.open(url, '_blank');
  }
}
function startTour(){
  const list = filteredClientList();
  if (list.length === 0) { alert('لا يوجد عملاء في القائمة الحالية'); return; }
  const withLoc = list.filter(c => c.lat != null && c.lng != null);
  const withoutLoc = list.filter(c => c.lat == null || c.lng == null);
  if (withLoc.length === 0) { alert('لا يوجد عميل في القائمة الحالية له موقع مسجل بعد. سجّل موقع العميل من فورم تعديله الأول.'); return; }
  if (withoutLoc.length > 0) {
    const names = withoutLoc.map(c => c.name).join('، ');
    if (!confirm('تنبيه: ' + withoutLoc.length + ' عميل من غير موقع مسجل (' + names + ') مش هيدخلوا الجولة. متابعة بالباقي (' + withLoc.length + ' عميل)؟')) return;
  }
  if (!navigator.geolocation) { alert('المتصفح مش بيدعم تحديد الموقع'); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const start = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      const ordered = nearestNeighborOrder(start, withLoc);
      openMapsRoute(ordered);
    },
    () => alert('تعذر تحديد موقعك الحالي. فعّل صلاحية الموقع وحاول تاني.'),
    {enableHighAccuracy: true, timeout: 15000}
  );
}

async function doExport(){
  try { await ensureXLSX(); }
  catch (e) { alert('تعذر تحميل مكتبة الإكسيل. تأكد إن الإنترنت شغال وجرّب تاني.'); return; }

  // لو العميل المختار سابقًا اتحذف، ارجع تلقائيًا لكل العملاء بدل ما يطلع ملف فاضي
  if (exportClient !== 'all' && !clients.some(c => c.id === exportClient)) {
    exportClient = 'all';
  }

  const filtered = getExportFiltered();

  // حدد قائمة العملاء المطلوب إظهارهم: عميل واحد فقط أو كل العملاء
  const clientsToShow = exportClient === 'all' ? sortedClients() : clients.filter(c => c.id === exportClient);
  if (clientsToShow.length === 0) { alert('لا يوجد عملاء مسجلين لتصديرهم. أضف عميل أولاً من تبويب العملاء.'); return; }

  const rows = clientsToShow.map(c => {
    const ct = filtered.filter(t => t.clientId === c.id);
    const totalSent = ct.reduce((s,t) => s + t.amountSent, 0);
    const totalCollected = ct.reduce((s,t) => s + txPaid(t), 0);
    const totalPending = totalSent - totalCollected;
    return {
      'اسم العميل': c.name,
      'اسم المحل': c.storeName || '-',
      'رقم المكنة': c.machineNumber || '-',
      'المنطقة': c.location || '-',
      'العنوان': c.address || '-',
      'رقم الهاتف': c.phone || '-',
      [('الرصيد المرسل (' + periodLabel() + ')')]: totalSent,
      'تم تحصيله': totalCollected,
      'المتبقي': totalPending
    };
  });

  const grandTotalSent = rows.reduce((s,r) => s + r['الرصيد المرسل (' + periodLabel() + ')'], 0);
  const grandTotalCollected = rows.reduce((s,r) => s + r['تم تحصيله'], 0);
  const grandTotalPending = rows.reduce((s,r) => s + r['المتبقي'], 0);
  const totalRow = {
    'اسم العميل': 'الإجمالي',
    'رقم المكنة': '',
    'المنطقة': '',
    'العنوان': '',
    'رقم الهاتف': '',
    ['الرصيد المرسل (' + periodLabel() + ')']: grandTotalSent,
    'تم تحصيله': grandTotalCollected,
    'المتبقي': grandTotalPending
  };

  const ws = XLSX.utils.json_to_sheet(rows.concat([totalRow]));
  ws['!cols'] = [{wch:22},{wch:14},{wch:18},{wch:24},{wch:15},{wch:22},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'التحصيل');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = buildFileName();
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    };

  }

function triggerRestoreBackup(){
  const el = document.getElementById('restore-backup-input');
  if (el) el.click();
}
function handleRestoreBackup(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.clients) || !Array.isArray(data.transactions)) {
        alert('ملف النسخة الاحتياطية غير صالح أو تالف');
        event.target.value = '';
        return;
      }
      const summary = 'هذه النسخة تحتوي على:\n'
        + data.clients.length + ' عميل\n'
        + data.transactions.length + ' معاملة\n'
        + (Array.isArray(data.areas) ? data.areas.length : 0) + ' منطقة\n\n'
        + 'استعادتها ستستبدل كل البيانات الحالية في التطبيق بالكامل. متابعة؟';
      if (!confirm(summary)) { event.target.value = ''; return; }
      clients = data.clients || [];
      transactions = data.transactions || [];
      areas = Array.isArray(data.areas) ? data.areas : [];
      saveData();
      render();
      alert('تم استعادة النسخة الاحتياطية بنجاح');
    } catch (err) {
      alert('تعذر قراءة الملف. تأكد أنه ملف نسخة احتياطية صحيح (JSON).');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

/* ---------------- Import from Excel ---------------- */
function triggerImport(){
  const el = document.getElementById('import-file-input');
  if (el) el.click();
}

async function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try { await ensureXLSX(); }
  catch (e) { alert('تعذر تحميل مكتبة الإكسيل. تأكد إن الإنترنت شغال وجرّب تاني.'); event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type: 'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval: ''});
      importClientsFromRows(rows);
    } catch (err) {
      alert('تعذر قراءة الملف. تأكد أنه ملف إكسيل صحيح (xlsx أو xls).');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function getImportField(row, possibleNames){
  const keys = Object.keys(row);
  for (const wanted of possibleNames) {
    const foundKey = keys.find(k => String(k).trim() === wanted);
    if (foundKey != null && String(row[foundKey]).trim() !== '') return String(row[foundKey]).trim();
  }
  return '';
}

function importClientsFromRows(rows){
  if (!rows || rows.length === 0) { alert('الملف لا يحتوي على بيانات'); return; }
  let added = 0, updated = 0, skipped = 0;
  rows.forEach(row => {
    const name = getImportField(row, ['اسم العميل', 'الاسم', 'اسم', 'Name', 'name']);
    if (!name) { skipped++; return; }
    const storeName = getImportField(row, ['اسم المحل', 'المحل', 'اسم المتجر', 'المتجر', 'Store', 'Store Name', 'Shop', 'Shop Name']);
    const machineNumber = getImportField(row, ['رقم المكنة', 'رقم الماكينة', 'المكنة', 'Machine', 'Machine Number']);
    const location = getImportField(row, ['المنطقة', 'Area', 'Region']);
    const address = getImportField(row, ['العنوان', 'الموقع', 'Address', 'Location']);
    const phone = getImportField(row, ['رقم الهاتف', 'الهاتف', 'تليفون', 'Phone']);

    const existing = clients.find(c =>
      c.name.trim() === name && (!machineNumber || (c.machineNumber || '') === machineNumber)
    );

    if (location && !areas.some(a => a.name === location)) {
      areas.push({id: uid('a'), name: location});
    }

    if (existing) {
      existing.storeName = storeName || existing.storeName;
      existing.machineNumber = machineNumber || existing.machineNumber;
      existing.location = location || existing.location;
      existing.address = address || existing.address;
      existing.phone = phone || existing.phone;
      updated++;
    } else {
      clients.push({id: uid('c'), name, storeName, machineNumber, location, address, phone, createdAt: todayStr()});
      added++;
    }
  });
  saveData();
  render();
  let msg = 'تم الاستيراد بنجاح:\n' + added + ' عميل جديد تمت إضافته';
  if (updated > 0) msg += '\n' + updated + ' عميل موجود تم تحديث بياناته';
  if (skipped > 0) msg += '\n' + skipped + ' صف تم تجاهله (بدون اسم عميل)';
  alert(msg);
}

/* ---------------- Render ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  document.getElementById('root').innerHTML = buildApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

    + '<button class="export-btn" style="background:var(--panel);color:var(--accent);border:1.5px solid var(--accent-border);margin-top:8px" onclick="triggerRestoreBackup()">♻️ استعادة من نسخة احتياطية</button>'
    + '<input id="restore-backup-input" type="file" accept="application/json,.json" style="display:none" onchange="handleRestoreBackup(event)">';
}

function buildBottomNav(){
  const navs = [
    {id:'daily', label:'التحصيل', icon:'calendar'},
    {id:'clients', label:'العملاء', icon:'users'},
    {id:'followup', label:'المتابعة', icon:'bell'},
    {id:'areas', label:'المناطق', icon:'map'},
    {id:'export', label:'التقارير', icon:'chart'}
  ];
  return '<div class="bottom-nav">'
    + navs.map(n => '<button class="' + (tab === n.id ? 'nav-btn-active' : 'nav-btn') + '" onclick="setTab(\'' + n.id + '\')"><span>' + ICON[n.icon] + '</span><span class="nav-label">' + n.label + '</span></button>').join('')
    + '</div>';
}

function buildAreaOptionsForClient(currentLocation){
  let names = sortedAreas().map(a => a.name);
  if (currentLocation && !names.includes(currentLocation)) names = [currentLocation].concat(names);
  let opts = '<option value=""' + (currentLocation ? '' : ' selected') + '>بدون منطقة</option>';
  opts += names.map(n => '<option value="' + esc(n) + '" ' + (n === currentLocation ? 'selected' : '') + '>' + esc(n) + '</option>').join('');
  opts += '<option value="__new__">+ إضافة منطقة جديدة</option>';
  return opts;
}
function handleAreaSelectChange(sel){
  if (sel.value !== '__new__') return;
  const name = prompt('اسم المنطقة الجديدة:');
  if (name && name.trim()) {
    const trimmed = name.trim();
    if (!areas.some(a => a.name === trimmed)) {
      areas.push({id: uid('a'), name: trimmed});
      saveData();
    }
    const opt = document.createElement('option');
    opt.value = trimmed; opt.textContent = trimmed;
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = trimmed;
  } else {
    sel.value = '';
  }
}

function buildClientModal(){
  const c = editingClientId ? clients.find(x => x.id === editingClientId) : null;
  const hasLoc = c && c.lat != null && c.lng != null;
  return '<div class="modal-overlay" onclick="closeClientModal()"><div class="modal-card" onclick="event.stopPropagation()">'
    + '<div class="modal-head"><div class="modal-title">' + (c ? 'تعديل بيانات العميل' : 'عميل جديد') + '</div>'
    + '<button class="icon-btn" onclick="closeClientModal()">✕</button></div>'
    + '<label class="field-label">اسم العميل</label>'
    + '<input id="cf-name" class="select-field" value="' + (c ? esc(c.name) : '') + '" placeholder="مثال: أحمد محمد">'
    + '<label class="field-label">اسم المحل (اختياري)</label>'
    + '<input id="cf-store" class="select-field" value="' + (c ? esc(c.storeName||'') : '') + '" placeholder="مثال: محل النور">'
    + '<label class="field-label">رقم المكنة</label>'
    + '<input id="cf-machine" class="select-field" value="' + (c ? esc(c.machineNumber||'') : '') + '" placeholder="مثال: 12">'
    + '<label class="field-label">المنطقة</label>'
    + '<select id="cf-location" class="select-field" onchange="handleAreaSelectChange(this)">' + buildAreaOptionsForClient(c ? (c.location||'') : '') + '</select>'
    + '<label class="field-label">العنوان (اختياري)</label>'
    + '<input id="cf-address" class="select-field" value="' + (c ? esc(c.address||'') : '') + '" placeholder="مثال: شارع 10 - عمارة 5 - الدور 3">'
    + '<label class="field-label">رقم الهاتف (اختياري)</label>'
    + '<input id="cf-phone" class="select-field" value="' + (c ? esc(c.phone||'') : '') + '" placeholder="01xxxxxxxxx">'
    + '<label class="field-label">موقع العميل (لاستخدامه في الجولات)</label>'
    + '<input id="cf-lat" type="hidden" value="' + (hasLoc ? c.lat : '') + '">'
    + '<input id="cf-lng" type="hidden" value="' + (hasLoc ? c.lng : '') + '">'
    + '<button type="button" id="location-btn" class="location-btn" onclick="captureLocation()">' + (hasLoc ? '✅ الموقع مسجّل — اضغط للتحديث' : '📍 سجّل موقعي الحالي') + '</button>'
    + '<button class="export-btn" onclick="saveClientForm()">✓ حفظ</button>'
    + '</div></div>';
}

function buildAmountModal(){
  const c = clients.find(x => x.id === amountModalClientId);
  if (!c) return '';
  return '<div class="modal-overlay" onclick="closeAmountModal()"><div class="modal-card" onclick="event.stopPropagation()">'
    + '<div class="modal-head"><div class="modal-title">إرسال مبلغ لـ ' + esc(c.name) + '</div>'
    + '<button class="icon-btn" onclick="closeAmountModal()">✕</button></div>'
    + '<div style="font-size:12px;color:var(--hint);margin-bottom:8px">🕐 ' + fmtDateHuman(selectedDate) + '</div>'
    + '<label class="field-label">المبلغ المرسل (ج.م)</label>'
    + '<input id="am-amount" type="number" class="select-field" placeholder="0.00" autofocus>'
    + '<label class="field-label">ملاحظات (اختياري)</label>'
    + '<input id="am-note" class="select-field" placeholder="مثال: دفعة أولى">'
    + '<button class="export-btn" onclick="saveAmountForm()">✓ حفظ المعاملة</button>'
    + '</div></div>';
}

function buildPayModal(){
  const t = transactions.find(x => x.id === payModalTxId);
  const c = t ? clients.find(x => x.id === t.clientId) : null;
  if (!t) return '';
  const paid = txPaid(t);
  const pending = txPending(t);
  return '<div class="modal-overlay" onclick="closePayModal()"><div class="modal-card" onclick="event.stopPropagation()">'
    + '<div class="modal-head"><div class="modal-title">تحصيل من ' + esc(c ? c.name : 'عميل') + '</div>'
    + '<button class="icon-btn" onclick="closePayModal()">✕</button></div>'
    + '<div style="font-size:12px;color:var(--hint);margin-bottom:10px">🕐 ' + fmtDateHuman(t.date) + '</div>'
    + '<div class="preview-box">'
    + '<div>مبلغ المرسل: <b>' + fmtMoney(t.amountSent) + '</b></div>'
    + '<div>المسدد سابقًا: <b>' + fmtMoney(paid) + '</b></div>'
    + '<div>المتبقي: <b style="color:var(--amber)">' + fmtMoney(pending) + '</b></div>'
    + '</div>'
    + (pending > 0
        ? '<label class="field-label">المبلغ المدفوع الآن (ج.م)</label>'
          + '<input id="pm-amount" type="number" class="select-field" value="' + pending + '" autofocus>'
          + '<button type="button" class="location-btn" style="margin-top:8px" onclick="fillPayAmount()">🔁 تعبئة كامل المتبقي</button>'
          + '<button class="export-btn" onclick="savePayForm()">✓ تسجيل الدفعة</button>'
        : '<div style="text-align:center;color:var(--ok-ink);font-weight:700;margin-top:12px">✓ تم تحصيل هذا المبلغ بالكامل</div>')
    + '</div></div>';
}

function buildEditTxModal(){
  const t = transactions.find(x => x.id === editTxId);
  const c = t ? clients.find(x => x.id === t.clientId) : null;
  if (!t) return '';
  return '<div class="modal-overlay" onclick="closeEditTx()"><div class="modal-card" onclick="event.stopPropagation()">'
    + '<div class="modal-head"><div class="modal-title">تعديل المعاملة</div>'
    + '<button class="icon-btn" onclick="closeEditTx()">✕</button></div>'
    + '<div style="font-size:12px;color:var(--hint);margin-bottom:8px">' + esc(c ? c.name : '') + ' · ' + fmtDateHuman(t.date) + '</div>'
    + '<label class="field-label">المبلغ المرسل (ج.م)</label>'
    + '<input id="et-amount" type="number" class="select-field" value="' + t.amountSent + '" autofocus>'
    + (txPaid(t) > 0 ? '<div style="font-size:12px;color:var(--amber);font-weight:700;margin-top:6px">مسدد سابقًا: ' + fmtMoney(txPaid(t)) + ' (لن يتغير عند التعديل)</div>' : '')
    + '<label class="field-label">ملاحظات</label>'
    + '<input id="et-note" class="select-field" value="' + esc(t.notes||'') + '" placeholder="اختياري">'
    + '<button class="export-btn" onclick="saveEditTx()">✓ حفظ التعديل</button>'
    + '</div></div>';
}

function buildAreaModal(){
  const a = editingAreaId ? areas.find(x => x.id === editingAreaId) : null;
  return '<div class="modal-overlay" onclick="closeAreaModal()"><div class="modal-card" onclick="event.stopPropagation()">'
    + '<div class="modal-head"><div class="modal-title">' + (a ? 'تعديل المنطقة' : 'منطقة جديدة') + '</div>'
    + '<button class="icon-btn" onclick="closeAreaModal()">✕</button></div>'
    + '<label class="field-label">اسم المنطقة</label>'
    + '<input id="af-name" class="select-field" value="' + (a ? esc(a.name) : '') + '" placeholder="مثال: حي الأربعين">'
    + '<button class="export-btn" onclick="saveAreaForm()">✓ حفظ</button>'
    + '</div></div>';
}

/* ---------------- Init ---------------- */
applyTheme(getTheme());
loadData();
render();
refreshMyLocation(true);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js?v=5').catch((e) => console.log('SW registration failed', e));
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
