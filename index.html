<script>
/* ---------------- State & Helpers ---------------- */
const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const VISIT_RESULTS = {
  down:     {label: 'إنزال',       chipClass: 'vr-chip-down',    badgeClass: 'visit-badge-down',    emoji: '✅', color: '#5DCAA5'},
  active:   {label: 'شغال معانا',  chipClass: 'vr-chip-active',  badgeClass: 'visit-badge-active',  emoji: '🤝', color: '#7CB2EE'},
  thinking: {label: 'هيفكر',       chipClass: 'vr-chip-think',   badgeClass: 'visit-badge-think',   emoji: '⏳', color: '#EF9F27'},
  rejected: {label: 'رفض',         chipClass: 'vr-chip-reject',  badgeClass: 'visit-badge-reject',  emoji: '❌', color: '#F0908F'},
  installed:{label: 'تم الإنزال',  chipClass: 'vr-chip-installed', badgeClass: 'visit-badge-installed', emoji: '📦', color: '#C99BFA'}
};

let viewDate = new Date().toISOString().split('T')[0];
let areas = [];
let entries = [];
let callCenterCards = [];
let followUps = [];
let currentAreaId = '';
let currentPhoto = null;
let currentVisitResult = '';
let currentTab = 'home';
let ccSearchQuery = '';
let ocrDrafts = [];
let convertingCallCenterCardId = null;
let editingEntryId = null;
let locatingInProgress = false;

let entryDraft = {shopName: '', clientName: '', phone: '', address: '', notes: '', locationLink: '', machineNumber: ''};
let areaDraft = '';

function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}); }

/* ---------------- Storage (IndexedDB) ---------------- */
const DB_NAME = 'fielddata-db';
const DB_VERSION = 1;
let _dbPromise = null;

function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('global')) db.createObjectStore('global');
      if (!db.objectStoreNames.contains('daily')) db.createObjectStore('daily');
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}
function idbGet(store, key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(store, key, value){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGetAllEntries(store){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const os = tx.objectStore(store);
    const keysReq = os.getAllKeys();
    const valsReq = os.getAll();
    tx.oncomplete = () => {
      const out = [];
      for (let i = 0; i < keysReq.result.length; i++) out.push({key: keysReq.result[i], value: valsReq.result[i]});
      resolve(out);
    };
    tx.onerror = () => reject(tx.error);
  }));
}

/* one-time migration from the old localStorage version so نفس البيانات القديمة متضيعش */
async function migrateFromLocalStorageIfNeeded(){
  try {
    const already = await idbGet('global', 'migrated');
    if (already) return;
    const rawGlobal = localStorage.getItem('fielddata-global');
    if (rawGlobal) await idbSet('global', 'main', JSON.parse(rawGlobal));
    for (let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      if (key && key.startsWith('fielddata-data-')){
        const dateStr = key.replace('fielddata-data-', '');
        await idbSet('daily', dateStr, JSON.parse(localStorage.getItem(key)));
      }
    }
    await idbSet('global', 'migrated', true);
  } catch (e) { console.error('Migration error', e); }
}

async function loadData(){
  try {
    const g = await idbGet('global', 'main');
    if (g) {
      areas = g.areas || [];
      callCenterCards = g.callCenterCards || [];
      followUps = g.followUps || [];
    }
    const d = await idbGet('daily', viewDate);
    if (d) {
      entries = d.entries || [];
      currentAreaId = d.currentAreaId || '';
    } else {
      entries = [];
      currentAreaId = '';
    }
  } catch (e) { console.error('Load Error', e); }
}

let saveErrorShown = false;
async function saveData(){
  try {
    await idbSet('global', 'main', {areas, callCenterCards, followUps});
    await idbSet('daily', viewDate, {entries, currentAreaId});
    saveErrorShown = false;
    maybeAutoBackup();
  } catch (e) {
    console.error('Storage Error', e);
    if (!saveErrorShown) {
      saveErrorShown = true;
      alert('⚠️ حصل خطأ في حفظ البيانات على الجهاز. خد نسخة احتياطية فورًا من شاشة "التقارير" لحد ما تتأكد إن المشكلة اتحلت.');
    }
  }
}

async function changeDate(newDate) {
  await saveData();
  viewDate = newDate;
  await loadData();
  render();
}

/* ---------------- Actions ---------------- */
function setTab(tab){ currentTab = tab; render(); }

function addArea(){
  if(!areaDraft) return;
  areas.push({id: uid('a'), name: areaDraft});
  areaDraft = '';
  saveData(); render();
}

function deleteArea(id, e){
  e.stopPropagation();
  if(!confirm('هل أنت متأكد من حذف هذه المنطقة؟')) return;
  areas = areas.filter(a => a.id !== id);
  if(currentAreaId === id) currentAreaId = '';
  saveData(); render();
}

function selectArea(id){ currentAreaId = (currentAreaId === id) ? '' : id; saveData(); render(); }

function handlePhotoInput(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX_DIM = 1280;
      let w = img.width, h = img.height;
      const scale = Math.min(1, MAX_DIM / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      currentPhoto = { dataUrl, width: w, height: h };
      render();
    };
    img.onerror = () => { currentPhoto = { dataUrl: e.target.result }; render(); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function requestLocation(){
  if (!navigator.geolocation) { alert('الجهاز ده مش بيدعم تحديد الموقع'); return; }
  locatingInProgress = true;
  render();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    entryDraft.locationLink = 'https://www.google.com/maps?q=' + lat + ',' + lon;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&accept-language=ar&zoom=18');
      const data = await res.json();
      entryDraft.address = (data && data.display_name) ? data.display_name : (lat.toFixed(6) + ', ' + lon.toFixed(6));
    } catch (err) {
      entryDraft.address = lat.toFixed(6) + ', ' + lon.toFixed(6);
    }
    locatingInProgress = false;
    render();
  }, (err) => {
    locatingInProgress = false;
    alert('تعذر تحديد الموقع: ' + (err && err.message ? err.message : 'تأكد من تفعيل صلاحية الموقع للمتصفح'));
    render();
  }, {enableHighAccuracy: true, timeout: 15000});
}
function clearLocation(){
  entryDraft.locationLink = '';
  render();
}

function editEntry(id) {
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    editingEntryId = id;
    entryDraft = { 
        shopName: entry.shopName, 
        clientName: entry.clientName, 
        phone: entry.phone, 
        address: entry.address, 
        notes: entry.notes,
        locationLink: entry.locationLink || '',
        machineNumber: entry.machineNumber || ''
    };
    currentVisitResult = entry.visitResult;
    currentAreaId = entry.areaId;
    currentPhoto = entry.photo;
    window.scrollTo({top: 0, behavior: 'smooth'});
    render();
}

function cancelEdit() {
    editingEntryId = null;
    entryDraft = {shopName: '', clientName: '', phone: '', address: '', notes: '', locationLink: '', machineNumber: ''};
    currentVisitResult = '';
    currentPhoto = null;
    render();
}

function addEntry(){
  if (!currentAreaId) { alert('اختر منطقة أولاً'); return; }
  if (!entryDraft.shopName && !currentVisitResult) { alert('أدخل بيانات الزيارة'); return; }
  
  const entryData = {
    id: editingEntryId || uid('e'),
    areaId: currentAreaId,
    shopName: entryDraft.shopName,
    clientName: entryDraft.clientName,
    phone: entryDraft.phone,
    address: entryDraft.address,
    locationLink: entryDraft.locationLink || '',
    machineNumber: entryDraft.machineNumber || '',
    visitResult: currentVisitResult,
    notes: entryDraft.notes,
    photo: currentPhoto,
    time: editingEntryId ? entries.find(e => e.id === editingEntryId).time : new Date().toISOString()
  };

  if (editingEntryId) {
      entries = entries.map(e => e.id === editingEntryId ? entryData : e);
  } else {
      entries.push(entryData);
  }

  if (convertingCallCenterCardId && !editingEntryId) {
    const c = callCenterCards.find(x => x.id === convertingCallCenterCardId);
    if (c) c.convertedToVisit = true;
    convertingCallCenterCardId = null;
  }

  /* عملاء "إنزال" بيتحطوا في المتابعة تلقائي، وباقي النتائج تفضل تحتاج تحويل يدوي بزرار */
  if (entryData.visitResult === 'down') {
    addToFollowUpFromEntry(entryData);
  }

  editingEntryId = null;
  currentPhoto = null; currentVisitResult = '';
  entryDraft = {shopName: '', clientName: '', phone: '', address: '', notes: '', locationLink: '', machineNumber: ''};
  saveData(); render();
}

/* ---------------- Follow-up (متابعة) ---------------- */
function addToFollowUpFromEntry(entryData){
  const existing = followUps.find(f => f.entryId === entryData.id);
  if (existing) {
    existing.shopName = entryData.shopName;
    existing.clientName = entryData.clientName;
    existing.phone = entryData.phone;
    existing.areaId = entryData.areaId;
    existing.visitResult = entryData.visitResult;
    existing.notes = entryData.notes;
    existing.machineNumber = entryData.machineNumber || '';
    if (existing.reminderAt === undefined) existing.reminderAt = '';
    return existing;
  }
  const item = {
    id: uid('f'),
    entryId: entryData.id,
    shopName: entryData.shopName,
    clientName: entryData.clientName,
    phone: entryData.phone,
    areaId: entryData.areaId,
    visitResult: entryData.visitResult,
    notes: entryData.notes,
    machineNumber: entryData.machineNumber || '',
    reminderAt: '',
    addedAt: new Date().toISOString()
  };
  followUps.push(item);
  return item;
}

/* تحديث نتيجة عنصر متابعة لـ "إنزال" - من غير ما نشيله من القائمة */
function markFollowUpDown(id){
  const f = followUps.find(x => x.id === id);
  if (!f) return;
  f.visitResult = 'down';
  saveData(); render();
}

/* ضبط/مسح موعد تذكير لعنصر متابعة */
function setReminder(id, value){
  const f = followUps.find(x => x.id === id);
  if (!f) return;
  f.reminderAt = value ? new Date(value).toISOString() : '';
  saveData(); render();
}
function clearReminder(id){
  const f = followUps.find(x => x.id === id);
  if (!f) return;
  f.reminderAt = '';
  saveData(); render();
}
function fmtReminder(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
}

function addToFollowUp(entryId){
  const e = entries.find(x => x.id === entryId);
  if (!e) return;
  addToFollowUpFromEntry(e);
  saveData(); render();
}

function isInFollowUp(entryId){
  return followUps.some(f => f.entryId === entryId);
}

function removeFollowUp(id){
  if (!confirm('تأكيد إن المتابعة خلصت وهيتشال من القائمة؟')) return;
  followUps = followUps.filter(f => f.id !== id);
  saveData(); render();
}

/* ---------------- Excel Export Logic ---------------- */
async function buildAndDownloadWorkbook(data, filename, includeDateColumn) {
    if (data.length === 0) { alert('لا توجد بيانات'); return; }

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('تقرير', {views: [{rightToLeft: true}]});

    const COLS = [];
    COLS.push({header: 'م', key: 'idx', width: 5});
    if (includeDateColumn) COLS.push({header: 'التاريخ', key: 'date', width: 12});
    COLS.push({header: 'المنطقة', key: 'area', width: 18});
    COLS.push({header: 'اسم المحل', key: 'shop', width: 22});
    COLS.push({header: 'اسم العميل', key: 'client', width: 20});
    COLS.push({header: 'رقم التليفون', key: 'phone', width: 15});
    COLS.push({header: 'العنوان', key: 'address', width: 24});
    COLS.push({header: 'رقم المكنة', key: 'machineNumber', width: 14});
    COLS.push({header: 'الموقع', key: 'location', width: 12});
    COLS.push({header: 'نتيجة الزيارة', key: 'visitResult', width: 14});
    COLS.push({header: 'ملاحظات', key: 'notes', width: 26});
    COLS.push({header: 'الوقت', key: 'time', width: 10});
    COLS.push({header: 'الصورة', key: 'photo', width: 18});
    ws.columns = COLS;
    const COL_COUNT = COLS.length;
    const PHOTO_COL_INDEX = COL_COUNT - 1;
    const LOCATION_COL_INDEX = COLS.findIndex(c => c.key === 'location') + 1;

    const headerRow = ws.getRow(1);
    headerRow.font = {bold: true, color: {argb: 'FFFFFFFF'}};
    headerRow.alignment = {horizontal: 'center', vertical: 'middle'};
    headerRow.eachCell((cell) => {
        cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF0B6E4F'}};
    });
    headerRow.height = 22;

    const sorted = data.slice().sort((a,b) => new Date(a.time) - new Date(b.time));
    const successEntries = sorted.filter(e => e.visitResult === 'down' || e.visitResult === 'active' || e.visitResult === 'installed');
    const otherEntries = sorted.filter(e => e.visitResult !== 'down' && e.visitResult !== 'active' && e.visitResult !== 'installed');
    const THUMB = 100;
    let rowCursor = 2;
    let globalIdx = 0;

    function addSectionTitle(title, fillArgb, fontArgb){
        const r = ws.getRow(rowCursor);
        r.getCell(1).value = title;
        ws.mergeCells(rowCursor, 1, rowCursor, COL_COUNT);
        r.font = {bold: true, size: 12, color: {argb: fontArgb}};
        r.alignment = {horizontal: 'center', vertical: 'middle'};
        r.height = 20;
        r.eachCell({includeEmpty: true}, (cell) => {
            cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: fillArgb}};
        });
        rowCursor++;
    }

    function addEntryRows(items, rowFillArgb){
        items.forEach((e) => {
            const area = areas.find(a => a.id === e.areaId);
            const vr = VISIT_RESULTS[e.visitResult];
            globalIdx++;
            const thisRowNum = rowCursor;
            const row = ws.getRow(thisRowNum);
            const rowData = {
                idx: globalIdx,
                area: area ? area.name : '-',
                shop: e.shopName || '-',
                client: e.clientName || '-',
                phone: e.phone || '-',
                address: e.address || '-',
                machineNumber: e.machineNumber || '-',
                visitResult: vr ? (vr.emoji + ' ' + vr.label) : '-',
                notes: e.notes || '-',
                time: fmtTime(e.time)
            };
            if (includeDateColumn) rowData.date = new Date(e.time).toLocaleDateString('ar-EG');
            row.values = rowData;
            if (e.locationLink) {
                row.getCell(LOCATION_COL_INDEX).value = {text: '📍 الموقع', hyperlink: e.locationLink};
                row.getCell(LOCATION_COL_INDEX).font = {color: {argb: 'FF1155CC'}, underline: true};
            }
            row.alignment = {vertical: 'middle', wrapText: true, horizontal: 'right'};
            row.height = 78;
            if (rowFillArgb) {
                row.eachCell({includeEmpty: true}, (cell) => {
                    if (!cell.font || !cell.font.underline) {
                        cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: rowFillArgb}};
                    }
                });
            }
            if (e.photo && e.photo.dataUrl) {
                const base64 = e.photo.dataUrl.split(',')[1];
                const imgId = wb.addImage({base64, extension: 'jpeg'});
                let w = e.photo.width || THUMB, h = e.photo.height || THUMB;
                const scale = Math.min(THUMB / w, THUMB / h, 1);
                const ext = {width: Math.round(w * scale), height: Math.round(h * scale)};
                ws.addImage(imgId, {tl: {col: PHOTO_COL_INDEX, row: thisRowNum - 1}, ext, editAs: 'oneCell'});
            }
            rowCursor++;
        });
    }

    addSectionTitle('✅ إنزال / 🤝 شغال معانا (' + successEntries.length + ')', 'FFDCEFE1', 'FF0B6E4F');
    if (successEntries.length === 0) {
        const r = ws.getRow(rowCursor);
        r.getCell(1).value = 'لا توجد سجلات في هذا القسم';
        ws.mergeCells(rowCursor, 1, rowCursor, COL_COUNT);
        r.alignment = {horizontal: 'center'};
        r.font = {italic: true, color: {argb: 'FF8A9A96'}};
        rowCursor++;
    } else {
        addEntryRows(successEntries, 'FFF3FAF6');
    }
    rowCursor++;
    addSectionTitle('⏳ هيفكر / ❌ رفض (' + otherEntries.length + ')', 'FFFBE9D8', 'FFA66A00');
    if (otherEntries.length === 0) {
        const r = ws.getRow(rowCursor);
        r.getCell(1).value = 'لا توجد سجلات في هذا القسم';
        ws.mergeCells(rowCursor, 1, rowCursor, COL_COUNT);
        r.alignment = {horizontal: 'center'};
        r.font = {italic: true, color: {argb: 'FF8A9A96'}};
        rowCursor++;
    } else {
        addEntryRows(otherEntries, 'FFFDF6EC');
    }

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
}

function exportDaily() {
    buildAndDownloadWorkbook(entries, `تقرير_اليوم_${viewDate}.xlsx`, false);
}

async function exportPeriodic(days) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);

    let allEntries = [];
    const all = await idbGetAllEntries('daily');
    all.forEach(({key, value}) => {
        if (key !== 'migrated' && new Date(key) >= cutoff && value && value.entries) {
            allEntries = allEntries.concat(value.entries);
        }
    });
    allEntries.sort((a,b) => new Date(a.time) - new Date(b.time));
    buildAndDownloadWorkbook(allEntries, `تقرير_${days}_يوم.xlsx`, true);
}

/* ---------------- Backup / Restore to phone Downloads ---------------- */
const BACKUP_FOLDER = 'احتياطي الداتا';
const BACKUP_FILENAME = 'نسخة احتياطية - جامع البيانات الميدانية.json';
const BACKUP_PATH = BACKUP_FOLDER + '/' + BACKUP_FILENAME;
const AUTO_BACKUP_INTERVAL_MS = 7 * 24 * 60 * 60 * 1000; // مرة كل أسبوع بحد أقصى، مش يوم بيوم

/* الفاصل الزمني بيتقاس من تاريخ محفوظ داخل IndexedDB نفسها (مش متغير في الذاكرة)
   عشان لو أندرويد قفل الصفحة في الخلفية (زي وقت فتح الكاميرا) ورجعت تاني، النظام يفتكر آخر مرة أخد فيها نسخة فعليًا
   ومايكررش التنزيل من غير داعي. */
async function maybeAutoBackup(){
  try {
    const last = await idbGet('global', 'lastBackupAt');
    const now = Date.now();
    if (!last || (now - new Date(last).getTime()) > AUTO_BACKUP_INTERVAL_MS) {
      await idbSet('global', 'lastBackupAt', new Date().toISOString());
      await downloadBackupFile(true);
    }
  } catch (e) { console.error('Auto backup check failed', e); }
}

async function downloadBackupFile(silent){
  try {
    const g = (await idbGet('global', 'main')) || {areas: [], callCenterCards: [], followUps: []};
    const all = await idbGetAllEntries('daily');
    const daily = {};
    all.forEach(({key, value}) => { daily[key] = value; });
    const backup = { version: 1, savedAt: new Date().toISOString(), global: g, daily };
    const blob = new Blob([JSON.stringify(backup)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = BACKUP_PATH;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    if (!silent) alert('✅ اتحفظت نسخة احتياطية باسم "' + BACKUP_FILENAME + '" جوه فولدر "' + BACKUP_FOLDER + '" داخل مجلد التنزيلات (Downloads) بالهاتف.\n\nملحوظة: لو الملف ده موجود قبل كده، أندرويد ممكن يحفظه باسم فيه (1) بدل ما يستبدله — دي سياسة أمان من المتصفح نفسه ومقدرش أتحكم فيها.');
  } catch (e) {
    console.error('Backup error', e);
    if (!silent) alert('❌ حصل خطأ أثناء أخد النسخة الاحتياطية');
  }
}

async function importBackupFile(event){
  const file = event.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    if (!backup || !backup.daily) { alert('ملف النسخة الاحتياطية مش صالح'); return; }
    if (!confirm('استيراد النسخة الاحتياطية دي هيدمج البيانات مع الموجود حاليًا (وهيستبدل بيانات نفس اليوم لو موجودة). متأكد؟')) return;
    if (backup.global) await idbSet('global', 'main', backup.global);
    for (const dateKey in backup.daily) { await idbSet('daily', dateKey, backup.daily[dateKey]); }
    await loadData();
    render();
    alert('✅ تم استيراد النسخة الاحتياطية بنجاح');
  } catch (e) {
    console.error(e);
    alert('❌ فشل استيراد الملف، تأكد إنه ملف نسخة احتياطية صحيح');
  } finally {
    event.target.value = '';
  }
}

/* ---------------- Follow-up Excel Export ---------------- */
async function exportFollowUps() {
  if (followUps.length === 0) { alert('لا توجد بيانات متابعة لتصديرها'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('متابعة', {views: [{rightToLeft: true}]});
  ws.columns = [
    {header: 'م', key: 'idx', width: 5},
    {header: 'اسم المحل', key: 'shop', width: 22},
    {header: 'اسم العميل', key: 'client', width: 18},
    {header: 'رقم التليفون', key: 'phone', width: 15},
    {header: 'رقم المكنة', key: 'machineNumber', width: 14},
    {header: 'المنطقة', key: 'area', width: 16},
    {header: 'النتيجة', key: 'result', width: 14},
    {header: 'موعد التذكير', key: 'reminder', width: 18},
    {header: 'ملاحظات', key: 'notes', width: 26}
  ];
  const headerRow = ws.getRow(1);
  headerRow.font = {bold: true, color: {argb: 'FFFFFFFF'}};
  headerRow.alignment = {horizontal: 'center', vertical: 'middle'};
  headerRow.eachCell((cell) => { cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF0B6E4F'}}; });
  headerRow.height = 22;

  followUps.slice().reverse().forEach((f, i) => {
    const area = areas.find(a => a.id === f.areaId);
    const vr = VISIT_RESULTS[f.visitResult];
    const row = ws.addRow({
      idx: i + 1,
      shop: f.shopName || '-',
      client: f.clientName || '-',
      phone: f.phone || '-',
      machineNumber: f.machineNumber || '-',
      area: area ? area.name : '-',
      result: vr ? (vr.emoji + ' ' + vr.label) : '-',
      reminder: f.reminderAt ? fmtReminder(f.reminderAt) : '-',
      notes: f.notes || '-'
    });
    row.alignment = {vertical: 'middle', wrapText: true, horizontal: 'right'};
    row.eachCell((cell) => {
      cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: f.visitResult === 'down' ? 'FFF3FAF6' : 'FFFDF6EC'}};
    });
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'بيانات_المتابعة.xlsx'; a.click();
  URL.revokeObjectURL(url);
}

function convertToVisit(id){
  const c = callCenterCards.find(x => x.id === id);
  if(!c) return;
  entryDraft = { 
    shopName: c.shopName || '', 
    clientName: c.clientName || '', 
    phone: c.phone || '', 
    address: '', 
    notes: `تحويل كول سنتر: مكنة ${c.machineNumber || '؟'} ${c.notes ? ' | ' + c.notes : ''}`,
    locationLink: '',
    machineNumber: c.machineNumber || ''
  };
  currentAreaId = c.areaId || currentAreaId;
  convertingCallCenterCardId = id;
  currentTab = 'home';
  render();
}

function buildNav(){
  const tabs = [
    {id: 'home', icon: '🏠', label: 'اليوم'},
    {id: 'followup', icon: '📌', label: 'متابعة'},
    {id: 'callcenter', icon: '☎️', label: 'كول سنتر'},
    {id: 'reports', icon: '📊', label: 'التقارير'}
  ];
  return `
    <div class="bottom-nav">
      ${tabs.map(t => `
        <button class="nav-btn ${currentTab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')">
          <span class="nav-btn-icon">${t.icon}</span>
          <span>${t.label}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function render(){
  const root = document.getElementById('root');
  let content = '';
  if(currentTab === 'home') content = buildHome();
  else if(currentTab === 'followup') content = buildFollowup();
  else if(currentTab === 'callcenter') content = buildCallCenter();
  else content = buildReports();

  root.innerHTML = `
    <div class="app-shell">
      ${buildHeader()}
      <div class="body">${content}</div>
      ${buildNav()}
    </div>
  `;
}

function updateCCField(id, field, value) {
  const card = callCenterCards.find(c => c.id === id);
  if (card) { card[field] = value; saveData(); }
}
function processPaste() {
  const text = document.getElementById('paste-input').value;
  if (!text) return;
  const lines = text.split('\n').filter(l => l.trim());
  lines.forEach(line => {
    const phone = (line.match(/01[0125]\d{8}/) || [''])[0];
    const machine = (line.match(/\d{4,7}/) || [''])[0];
    let name = line.replace(phone, '').replace(machine, '').replace(/[-:,]/g, '').trim();
    if (phone || machine || name) {
      callCenterCards.push({ id: uid('cc'), shopName: name, machineNumber: machine, phone: phone, clientName: '', areaId: '', notes: '', time: new Date().toISOString(), convertedToVisit: false });
    }
  });
  document.getElementById('paste-input').value = '';
  document.getElementById('paste-modal').style.display = 'none';
  saveData(); render();
}
async function handleExcelUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const workbook = new ExcelJS.Workbook();
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      await workbook.xlsx.load(e.target.result);
      const ws = workbook.getWorksheet(1);
      ws.eachRow((row, rowNumber) => {
        if (rowNumber === 1) return;
        const shopName = row.getCell(1).value?.toString() || '';
        const machine = row.getCell(2).value?.toString() || '';
        const phone = row.getCell(3).value?.toString() || '';
        if (shopName || machine || phone) {
          callCenterCards.push({ id: uid('cc'), shopName, machineNumber: machine, phone, clientName: '', areaId: '', notes: '', time: new Date().toISOString(), convertedToVisit: false });
        }
      });
      saveData(); render();
    } catch (err) { alert('خطأ في قراءة الملف'); }
  };
  reader.readAsArrayBuffer(file);
}
async function handleScanOCR(event) {
  const file = event.target.files[0];
  if (!file) return;
  const btn = document.getElementById('scan-btn');
  btn.innerHTML = '⏳ جاري المعالجة...';
  try {
    const worker = await Tesseract.createWorker('ara+eng');
    const { data: { text } } = await worker.recognize(file);
    await worker.terminate();
    const lines = text.split('\n').filter(l => l.trim().length > 3);
    ocrDrafts = lines.map(line => {
      const phone = (line.match(/01[0125]\d{8}/) || [''])[0];
      const machine = (line.match(/\d{4,7}/) || [''])[0];
      let shop = line.replace(phone, '').replace(machine, '').trim();
      return { id: uid('ocr'), phone, machine, shop, original: line };
    });
    showOCRModal();
  } catch (e) { alert('فشل المسح الضوئي'); }
  finally { btn.innerHTML = '🔍 مسح صورة ذكي'; event.target.value = ''; }
}
function showOCRModal() {
  const container = document.getElementById('ocr-results-list');
  container.innerHTML = ocrDrafts.map((d, i) => `
    <div class="followup-card glass" style="margin-bottom:10px; padding:12px;">
      <div style="font-size:10px; color:#7C8C86; margin-bottom:5px;">${esc(d.original)}</div>
      <input class="select-field" style="margin-bottom:8px;" placeholder="اسم المحل" value="${esc(d.shop)}" oninput="ocrDrafts[${i}].shop=this.value">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <input class="select-field" placeholder="مكنة" value="${d.machine}" oninput="ocrDrafts[${i}].machine=this.value">
        <input class="select-field" placeholder="تليفون" value="${d.phone}" oninput="ocrDrafts[${i}].phone=this.value">
      </div>
    </div>
  `).join('');
  document.getElementById('ocr-modal').style.display = 'flex';
}
function confirmOCR() {
  ocrDrafts.forEach(d => {
    callCenterCards.push({ id: uid('cc'), shopName: d.shop, machineNumber: d.machine, phone: d.phone, clientName: '', areaId: '', notes: '', time: new Date().toISOString(), convertedToVisit: false });
  });
  saveData(); closeOCR(); render();
}
function closeOCR() { document.getElementById('ocr-modal').style.display = 'none'; ocrDrafts = []; }

(async function init(){
  await migrateFromLocalStorageIfNeeded();
  await loadData();
  render();
})();

/* تسجيل الـ Service Worker عشان كروم يقدر يعتبر التطبيق قابل للتثبيت (PWA حقيقي مش مجرد اختصار).
   ده بيشتغل بس لو الملف متفتح من سيرفر HTTPS (أو localhost) — مش من ملف على الجهاز مباشرة. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((err) => {
      console.error('SW registration failed:', err);
    });
  });
}
