<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>سجل التحصيل اليومي</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap');
  :root {
    --bg: #EEF6F2; --panel: #fff; --card: #fff; --border: #E4EEE8;
    --text: #14422F; --muted: #6E8A7D; --accent: #00A877; --accent-strong: #00C48C;
    --accent-soft: #7BE0BE; --amber: #FF9F1C; --red: #FF4D6D; --green: #00C48C;
  }
  html, body { background: var(--bg); }
  .app-shell { background: linear-gradient(180deg, #DDF6EA 0%, var(--bg) 30%); }
  .header { background: linear-gradient(120deg, #00A877 0%, #00C48C 45%, #4DD2B0 80%, #7BE0BE 100%); padding: 20px 16px; color: #fff; border-radius: 0 0 26px 26px; box-shadow: 0 8px 24px rgba(0,168,119,.35); }
  .header-top { display: flex; align-items: center; gap: 12px; }
  .brand-ring { background: rgba(255,255,255,.25); border-radius: 50%; padding: 2px; flex-shrink: 0; }
  .brand-title { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 18px; text-shadow: 0 2px 6px rgba(0,0,0,.2); }

  .date-arrow { background: #E8F8EF; color: var(--accent); }
  .date-input { color: var(--text); }
  .date-human { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .stat-card { background: var(--card); border-radius: 14px; box-shadow: 0 4px 14px rgba(20,66,47,.08); border-top: 3px solid var(--accent-strong); }
  .stat-card:nth-child(2) { border-top-color: #FFD166; }
  .stat-card:nth-child(3) { border-top-color: #FF9F1C; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-value { font-size: 15px; font-weight: 800; margin-top: 2px; }
  .search-row { background: var(--card); border-radius: 14px; box-shadow: 0 4px 14px rgba(20,66,47,.08); }
  .search-input { color: var(--text); }
  .add-client-btn { background: linear-gradient(135deg, #00A877, #00C48C); color: #fff; box-shadow: 0 3px 8px rgba(0,168,119,.35); }
  .tour-btn { background: linear-gradient(135deg, #FFF3DF, #FFE9C7); color: #B2630A; border: 1px solid #F6D9A8; }
  .client-card { background: var(--card); border-radius: 16px; box-shadow: 0 5px 16px rgba(20,66,47,.09); border: 1px solid #E6F0EA; }
  .client-name { font-weight: 800; font-size: 14.5px; color: var(--text); }
  .client-store { color: #fff; background: linear-gradient(135deg, #00A877, #00C48C); box-shadow: 0 2px 6px rgba(0,168,119,.3); }
  .client-machine { font-weight: 700; font-size: 13px; color: var(--text); margin-top: 3px; }
  .client-meta { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: 3px; }
  .phone-action { background: #E8F8EF; color: var(--text); }
  .client-footer { color: var(--muted); }
  .send-btn { background: #E8F8EF; color: var(--accent); }
  .quick-btn { background: #FFF3DF; color: #C9862B; }
  .tx-amount { font-weight: 800; font-size: 13px; color: var(--text); }
  .tx-note { font-size: 11.5px; color: var(--muted); }
  .collected-pill { background: linear-gradient(135deg, #00A877, #00C48C); color: #fff; box-shadow: 0 2px 6px rgba(0,168,119,.3); }
  .pending-pill { background: #FFF3DF; color: #C9862B; }
  .trash-btn { color: var(--red); }
  .icon-btn { background: #E8F8EF; color: var(--text); }
  .icon-btn-danger { background: #FFE9EC; color: var(--red); }
  .empty-state { color: var(--muted); }
  .section-title { color: var(--text); }
  .field-label { color: var(--muted); }
  .select-field { background: #fff; color: var(--text); border-color: #DDEBE2; }
  .location-btn { background: #fff; color: var(--accent); border-color: var(--accent-soft); }
  .segment-btn { border-color: #DDEBE2; background: #fff; color: var(--muted); }
  .segment-btn-active { border-color: var(--accent-strong); background: linear-gradient(135deg, #00A877, #00C48C); color: #fff; font-weight: 800; }
  .preview-box { background: #E8F8EF; color: var(--text); }
  .export-btn { background: linear-gradient(135deg, #00A877, #00C48C); color: #fff; box-shadow: 0 4px 12px rgba(0,168,119,.35); }
  .bottom-nav { background: #fff; border-color: #E8EEE9; box-shadow: 0 -4px 16px rgba(20,66,47,.06); }
  .nav-btn { color: #9FB6AA; }
  .nav-btn-active { color: var(--accent); font-weight: 800; }
  .modal-overlay { background: rgba(10,40,30,.45); }
  .modal-card { background: #fff; }
  .modal-title { color: var(--text); }


  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalSlideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }


  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  html, body { margin: 0; padding: 0; }
  input, select, button { font-family: 'Tajawal', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  button { cursor: pointer; transition: transform .12s ease, opacity .12s ease; }
  button:active { transform: scale(0.95); }
  a:active { transform: scale(0.95); }
  input:focus, select:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .body { flex: 1; padding: 14px 14px 90px 14px; overflow-y: auto; animation: fadeSlideIn .25s ease; }
  .date-arrow { border: none; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .add-client-btn { border: none; border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .phone-action { border: none; border-radius: 6px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; text-decoration: none; }
  .send-btn { display: flex; align-items: center; gap: 4px; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .quick-btn { display: flex; align-items: center; justify-content: center; gap: 3px; border: none; border-radius: 8px; padding: 5px 8px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .collected-pill, .pending-pill { border: none; border-radius: 20px; padding: 4px 10px; font-size: 11px; }
  .trash-btn { border: none; background: transparent; padding: 4px; font-size: 14px; }
  .icon-btn { border: none; border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .icon-btn-danger { border: none; border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .segment-btn, .segment-btn-active { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid transparent; font-size: 12.5px; }
  .select-field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 13.5px; }
  .export-btn { width: 100%; border: none; border-radius: 10px; padding: 12px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .location-btn { width: 100%; border: 1.5px dashed var(--accent-soft); border-radius: 10px; padding: 10px 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .nav-btn, .nav-btn-active { flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 16px; }
  .modal-overlay { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: overlayFadeIn .18s ease; }
  .modal-card { width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 18px 16px 22px; max-height: 85vh; overflow-y: auto; animation: modalSlideUp .28s cubic-bezier(.2,.8,.2,1); }
  .segment-row { display: flex; gap: 6px; margin-bottom: 4px; }
  .tx-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tx-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
  .client-footer { display: flex; justify-content: space-between; font-size: 12px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .send-btn-col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .phone-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .client-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .client-store { font-weight: 800; font-size: 12.5px; display: inline-block; padding: 2px 8px; border-radius: 6px; margin-bottom: 4px; }
  .section-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15.5px; margin-bottom: 12px; }
  .field-label { font-size: 12.5px; font-weight: 700; margin-top: 12px; margin-bottom: 5px; display: block; }
  .preview-box { border-radius: 10px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
  .stats-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-card { flex: 1; border-radius: 10px; padding: 10px 8px; text-align: center; }
  .search-row { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 8px 12px; }
  .search-input { flex: 1; border: none; font-size: 13.5px; background: transparent; }
  .date-bar { display: flex; align-items: center; border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; }
  .date-input { border: none; font-size: 14px; font-weight: 700; text-align: center; background: transparent; }
  .tour-btn { width: 100%; margin-top: 8px; border-radius: 10px; padding: 10px 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .empty-state { text-align: center; font-size: 13px; padding: 30px 10px; }
  .bottom-nav { display: flex; border-top: 1px solid var(--border); padding: 6px 4px; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; }
  .client-card { border-radius: 12px; padding: 12px; animation: fadeSlideIn .3s ease; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .modal-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15px; }

</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------- Lazy-load XLSX library only when actually needed ---------------- */
let xlsxLoadPromise = null;
function ensureXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { xlsxLoadPromise = null; reject(new Error('تعذر تحميل مكتبة الإكسيل')); };
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}

/* ---------------- Helpers ---------------- */
function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function yearNum(){ return new Date().getFullYear(); }
const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fmtDateHuman(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtMoney(n){
  const num = Number(n) || 0;
  return num.toLocaleString('ar-EG', {maximumFractionDigits: 2}) + ' ج.م';
}
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- State ---------------- */
let clients = [];
let transactions = [];
let areas = [];
let tab = 'daily';
let selectedDate = todayStr();
let search = '';
let areaFilter = 'all';
let showClientModal = false;
let editingClientId = null;
let amountModalClientId = null;
let payModalTxId = null;
let editTxId = null;
let onlyDebtors = false;
let showAreaModal = false;
let editingAreaId = null;
let exportClient = 'all';
let exportPeriodType = 'day';
let exportDay = todayStr();
let exportMonth = monthStr();
let exportYear = yearNum();
let followupFilter = 'pending';
let myLocation = null;
let locatingInProgress = false;

function loadData(){
  try {
    const raw = localStorage.getItem('ledger-data');
    if (raw) {
      const d = JSON.parse(raw);
      clients = d.clients || [];
      transactions = (d.transactions || []).map(t => {
        if (t.paid == null) t.paid = t.collected ? t.amountSent : 0;
        return t;
      });
      areas = d.areas || [];
    }
  } catch (e) { console.error('load error', e); }
}
function saveData(){
  try { localStorage.setItem('ledger-data', JSON.stringify({clients, transactions, areas})); }
  catch (e) { alert('تعذر حفظ البيانات على هذا الجهاز'); }
}

/* ---------------- Derived data ---------------- */
function getDayTx(){ return transactions.filter(t => t.date === selectedDate); }
function txPaid(t){ return Number(t.paid) || 0; }
function txPending(t){ return t.amountSent - txPaid(t); }
function computeStats(txs){
  const total = txs.reduce((s,t) => s + t.amountSent, 0);
  const collected = txs.reduce((s,t) => s + txPaid(t), 0);
  const pending = total - collected;
  const pct = total > 0 ? Math.round(collected/total*100) : 0;
  return {total, collected, pending, pct, count: txs.length};
}
function sortedClients(){ return clients.slice().sort((a,b) => a.name.localeCompare(b.name,'ar')); }
function sortedAreas(){ return areas.slice().sort((a,b) => a.name.localeCompare(b.name,'ar')); }
function clientPendingTotal(clientId){
  return transactions.filter(t => t.clientId === clientId).reduce((s,t) => s + txPending(t), 0);
}
function buildOverdueBadge(c){
  const pend = clientPendingTotal(c.id);
  return pend > 0 ? '<div class="client-meta" style="color:#C0483F;font-weight:700">⚠️ متأخر عليه: ' + fmtMoney(pend) + '</div>' : '';
}
function filteredClientList(){
  const list = clients.filter(c =>
    (c.name.includes(search) || (c.storeName||'').includes(search) || (c.location||'').includes(search) || (c.address||'').includes(search) || (c.machineNumber||'').includes(search)) &&
    (areaFilter === 'all' || c.location === areaFilter) &&
    (!onlyDebtors || clientPendingTotal(c.id) > 0)
  );
  return sortByProximityOrName(list);
}
function sortByProximityOrName(list){
  if (!myLocation) return list.slice().sort((a,b) => a.name.localeCompare(b.name,'ar'));
  const withLoc = list.filter(c => c.lat != null && c.lng != null);
  const withoutLoc = list.filter(c => c.lat == null || c.lng == null);
  withLoc.sort((a,b) => distanceKm(myLocation, {lat:a.lat,lng:a.lng}) - distanceKm(myLocation, {lat:b.lat,lng:b.lng}));
  withoutLoc.sort((a,b) => a.name.localeCompare(b.name,'ar'));
  return withLoc.concat(withoutLoc);
}
function refreshMyLocation(silent){
  if (!navigator.geolocation) { if (!silent) alert('المتصفح ده مش بيدعم تحديد الموقع'); return; }
  locatingInProgress = true;
  if (!silent) render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      myLocation = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      locatingInProgress = false;
      render();
    },
    () => {
      locatingInProgress = false;
      if (!silent) alert('تعذر تحديد موقعك الحالي. فعّل صلاحية الموقع من إعدادات المتصفح وحاول تاني.');
      render();
    },
    {enableHighAccuracy: true, timeout: 15000}
  );
}
function buildLocationSortBar(){
  if (locatingInProgress) return '<div class="tour-btn" style="opacity:.7">📍 جاري تحديد موقعك...</div>';
  if (myLocation) return '<button class="tour-btn" onclick="refreshMyLocation(false)">📍 القائمة مرتبة حسب الأقرب لموقعك — تحديث</button>';
  return '<button class="tour-btn" onclick="refreshMyLocation(false)">📍 فعّل تحديد الموقع لترتيب العملاء حسب الأقرب</button>';
}
function setAreaFilter(v){ areaFilter = v; render(); }
function buildAreaFilterSelect(){
  if (areas.length === 0) return '';
  return '<select class="select-field" style="margin-top:8px" onchange="setAreaFilter(this.value)">'
    + '<option value="all"' + (areaFilter === 'all' ? ' selected' : '') + '>كل المناطق</option>'
    + sortedAreas().map(a => '<option value="' + esc(a.name) + '" ' + (areaFilter === a.name ? 'selected' : '') + '>' + esc(a.name) + '</option>').join('')
    + '</select>';
}

/* ---------------- Actions ---------------- */
function openNewClient(){ editingClientId = null; showClientModal = true; render(); }
function openEditClient(id){ editingClientId = id; showClientModal = true; render(); }
function closeClientModal(){ showClientModal = false; editingClientId = null; render(); }
function saveClientForm(){
  const name = document.getElementById('cf-name').value.trim();
  const storeName = document.getElementById('cf-store').value.trim();
  const machineNumber = document.getElementById('cf-machine').value.trim();
  const location = document.getElementById('cf-location').value.trim();
  const address = document.getElementById('cf-address').value.trim();
  const phone = document.getElementById('cf-phone').value.trim();
  const latRaw = document.getElementById('cf-lat').value;
  const lngRaw = document.getElementById('cf-lng').value;
  const lat = latRaw !== '' ? parseFloat(latRaw) : null;
  const lng = lngRaw !== '' ? parseFloat(lngRaw) : null;
  if (!name) { alert('أدخل اسم العميل'); return; }
  if (editingClientId) {
    clients = clients.map(c => c.id === editingClientId ? {...c, name, storeName, machineNumber, location, address, phone, lat, lng} : c);
  } else {
    clients.push({id: uid('c'), name, storeName, machineNumber, location, address, phone, lat, lng, createdAt: todayStr()});
  }
  saveData(); showClientModal = false; editingClientId = null; render();
}
function deleteClient(id){
  if (!confirm('حذف هذا العميل؟ سجل معاملاته السابقة سيبقى محفوظاً.')) return;
  clients = clients.filter(c => c.id !== id);
  saveData(); render();
}

/* ---------------- Areas ---------------- */
function openNewArea(){ editingAreaId = null; showAreaModal = true; render(); }
function openEditArea(id){ editingAreaId = id; showAreaModal = true; render(); }
function closeAreaModal(){ showAreaModal = false; editingAreaId = null; render(); }
function saveAreaForm(){
  const name = document.getElementById('af-name').value.trim();
  if (!name) { alert('أدخل اسم المنطقة'); return; }
  if (editingAreaId) {
    const area = areas.find(a => a.id === editingAreaId);
    if (area) {
      const oldName = area.name;
      area.name = name;
      if (oldName !== name) {
        clients = clients.map(c => c.location === oldName ? {...c, location: name} : c);
        if (areaFilter === oldName) areaFilter = name;
      }
    }
  } else {
    if (areas.some(a => a.name === name)) { alert('هذه المنطقة مسجلة بالفعل'); return; }
    areas.push({id: uid('a'), name});
  }
  saveData(); showAreaModal = false; editingAreaId = null; render();
}
function deleteArea(id){
  const area = areas.find(a => a.id === id);
  if (!area) return;
  const count = clients.filter(c => c.location === area.name).length;
  const msg = count > 0
    ? ('هذه المنطقة مرتبطة بـ ' + count + ' عميل. حذفها لن يحذف العملاء أو يمسح بيانات مناطقهم، لكنها ستختفي من قائمة المناطق المسجلة. متابعة؟')
    : 'حذف هذه المنطقة؟';
  if (!confirm(msg)) return;
  areas = areas.filter(a => a.id !== id);
  if (areaFilter === area.name) areaFilter = 'all';
  saveData(); render();
}

/* ---------------- Location & Tour ---------------- */
function captureLocation(){
  if (!navigator.geolocation) { alert('المتصفح ده مش بيدعم تحديد الموقع'); return; }
  const btn = document.getElementById('location-btn');
  if (btn) btn.textContent = '⏳ جاري تحديد الموقع...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById('cf-lat').value = pos.coords.latitude;
      document.getElementById('cf-lng').value = pos.coords.longitude;
      if (btn) btn.textContent = '✅ تم تسجيل موقعك الحالي';
    },
    () => {
      alert('تعذر تحديد الموقع. تأكد إن صلاحية الموقع مفعّلة للمتصفح وجرّب تاني.');
      if (btn) btn.textContent = '📍 سجّل موقعي الحالي';
    },
    {enableHighAccuracy: true, timeout: 15000}
  );
}
function distanceKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function nearestNeighborOrder(start, list){
  const remaining = list.slice();
  const ordered = [];
  let current = start;
  while (remaining.length) {
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((c, i) => {
      const d = distanceKm(current, {lat: c.lat, lng: c.lng});
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    ordered.push(next);
    current = {lat: next.lat, lng: next.lng};
  }
  return ordered;
}
function openMapsRoute(ordered){
  const CHUNK = 9; // أقصى عدد محطات تقريبي مدعوم في رابط جوجل ماب الواحد
  for (let i = 0; i < ordered.length; i += CHUNK) {
    const chunk = ordered.slice(i, i + CHUNK);
    const dest = chunk[chunk.length - 1];
    const waypoints = chunk.slice(0, -1).map(c => c.lat + ',' + c.lng).join('|');
    let url = 'https://www.google.com/maps/dir/?api=1&destination=' + dest.lat + ',' + dest.lng;
    if (waypoints) url += '&waypoints=' + encodeURIComponent(waypoints);
    url += '&travelmode=driving';
    window.open(url, '_blank');
  }
}
function startTour(){
  const list = filteredClientList();
  if (list.length === 0) { alert('لا يوجد عملاء في القائمة الحالية'); return; }
  const withLoc = list.filter(c => c.lat != null && c.lng != null);
  const withoutLoc = list.filter(c => c.lat == null || c.lng == null);
  if (withLoc.length === 0) { alert('لا يوجد عميل في القائمة الحالية له موقع مسجل بعد. سجّل موقع العميل من فورم تعديله الأول.'); return; }
  if (withoutLoc.length > 0) {
    const names = withoutLoc.map(c => c.name).join('، ');
    if (!confirm('تنبيه: ' + withoutLoc.length + ' عميل من غير موقع مسجل (' + names + ') مش هيدخلوا الجولة. متابعة بالباقي (' + withLoc.length + ' عميل)؟')) return;
  }
  if (!navigator.geolocation) { alert('المتصفح مش بيدعم تحديد الموقع'); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const start = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      const ordered = nearestNeighborOrder(start, withLoc);
      openMapsRoute(ordered);
    },
    () => alert('تعذر تحديد موقعك الحالي. فعّل صلاحية الموقع وحاول تاني.'),
    {enableHighAccuracy: true, timeout: 15000}
  );
}

async function doExport(){
  try { await ensureXLSX(); }
  catch (e) { alert('تعذر تحميل مكتبة الإكسيل. تأكد إن الإنترنت شغال وجرّب تاني.'); return; }

  // لو العميل المختار سابقًا اتحذف، ارجع تلقائيًا لكل العملاء بدل ما يطلع ملف فاضي
  if (exportClient !== 'all' && !clients.some(c => c.id === exportClient)) {
    exportClient = 'all';
  }

  const filtered = getExportFiltered();

  // حدد قائمة العملاء المطلوب إظهارهم: عميل واحد فقط أو كل العملاء
  const clientsToShow = exportClient === 'all' ? sortedClients() : clients.filter(c => c.id === exportClient);
  if (clientsToShow.length === 0) { alert('لا يوجد عملاء مسجلين لتصديرهم. أضف عميل أولاً من تبويب العملاء.'); return; }

  const rows = clientsToShow.map(c => {
    const ct = filtered.filter(t => t.clientId === c.id);
    const totalSent = ct.reduce((s,t) => s + t.amountSent, 0);
    const totalCollected = ct.reduce((s,t) => s + txPaid(t), 0);
    const totalPending = totalSent - totalCollected;
    return {
      'اسم العميل': c.name,
      'اسم المحل': c.storeName || '-',
      'رقم المكنة': c.machineNumber || '-',
      'المنطقة': c.location || '-',
      'العنوان': c.address || '-',
      'رقم الهاتف': c.phone || '-',
      [('الرصيد المرسل (' + periodLabel() + ')')]: totalSent,
      'تم تحصيله': totalCollected,
      'المتبقي': totalPending
    };
  });

  const grandTotalSent = rows.reduce((s,r) => s + r['الرصيد المرسل (' + periodLabel() + ')'], 0);
  const grandTotalCollected = rows.reduce((s,r) => s + r['تم تحصيله'], 0);
  const grandTotalPending = rows.reduce((s,r) => s + r['المتبقي'], 0);
  const totalRow = {
    'اسم العميل': 'الإجمالي',
    'رقم المكنة': '',
    'المنطقة': '',
    'العنوان': '',
    'رقم الهاتف': '',
    ['الرصيد المرسل (' + periodLabel() + ')']: grandTotalSent,
    'تم تحصيله': grandTotalCollected,
    'المتبقي': grandTotalPending
  };

  const ws = XLSX.utils.json_to_sheet(rows.concat([totalRow]));
  ws['!cols'] = [{wch:22},{wch:14},{wch:18},{wch:24},{wch:15},{wch:22},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'التحصيل');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = buildFileName();
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerRestoreBackup(){
  const el = document.getElementById('restore-backup-input');
  if (el) el.click();
}
function handleRestoreBackup(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.clients) || !Array.isArray(data.transactions)) {
        alert('ملف النسخة الاحتياطية غير صالح أو تالف');
        event.target.value = '';
        return;
      }
      const summary = 'هذه النسخة تحتوي على:\n'
        + data.clients.length + ' عميل\n'
        + data.transactions.length + ' معاملة\n'
        + (Array.isArray(data.areas) ? data.areas.length : 0) + ' منطقة\n\n'
        + 'استعادتها ستستبدل كل البيانات الحالية في التطبيق بالكامل. متابعة؟';
      if (!confirm(summary)) { event.target.value = ''; return; }
      clients = data.clients || [];
      transactions = data.transactions || [];
      areas = Array.isArray(data.areas) ? data.areas : [];
      saveData();
      render();
      alert('تم استعادة النسخة الاحتياطية بنجاح');
    } catch (err) {
      alert('تعذر قراءة الملف. تأكد أنه ملف نسخة احتياطية صحيح (JSON).');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

/* ---------------- Import from Excel ---------------- */
function triggerImport(){
  const el = document.getElementById('import-file-input');
  if (el) el.click();

async function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try { await ensureXLSX(); }
  catch (e) { alert('تعذر تحميل مكتبة الإكسيل. تأكد إن الإنترنت شغال وجرّب تاني.'); event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type: 'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval: ''});
      importClientsFromRows(rows);
    } catch (err) {
      alert('تعذر قراءة الملف. تأكد أنه ملف إكسيل صحيح (xlsx أو xls).');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function getImportField(row, possibleNames){
  const keys = Object.keys(row);
  for (const wanted of possibleNames) {
    const foundKey = keys.find(k => String(k).trim() === wanted);
    if (foundKey != null && String(row[foundKey]).trim() !== '') return String(row[foundKey]).trim();
  }
  return '';
}

function importClientsFromRows(rows){
  if (!rows || rows.length === 0) { alert('الملف لا يحتوي على بيانات'); return; }
  let added = 0, updated = 0, skipped = 0;
  rows.forEach(row => {
    const name = getImportField(row, ['اسم العميل', 'الاسم', 'اسم', 'Name', 'name']);
    if (!name) { skipped++; return; }
    const storeName = getImportField(row, ['اسم المحل', 'المحل', 'اسم المتجر', 'المتجر', 'Store', 'Store Name', 'Shop', 'Shop Name']);
    const machineNumber = getImportField(row, ['رقم المكنة', 'رقم الماكينة', 'المكنة', 'Machine', 'Machine Number']);
    const location = getImportField(row, ['المنطقة', 'Area', 'Region']);
    const address = getImportField(row, ['العنوان', 'الموقع', 'Address', 'Location']);
    const phone = getImportField(row, ['رقم الهاتف', 'الهاتف', 'تليفون', 'Phone']);

    const existing = clients.find(c =>
      c.name.trim() === name && (!machineNumber || (c.machineNumber || '') === machineNumber)
    );

    if (location && !areas.some(a => a.name === location)) {
      areas.push({id: uid('a'), name: location});
    }

    if (existing) {
      existing.storeName = storeName || existing.storeName;
      existing.machineNumber = machineNumber || existing.machineNumber;
      existing.location = location || existing.location;
      existing.address = address || existing.address;
      existing.phone = phone || existing.phone;
      updated++;
    } else {
      clients.push({id: uid('c'), name, storeName, machineNumber, location, address, phone, createdAt: todayStr()});
      added++;
    }
  });
  saveData();
  render();
  let msg = 'تم الاستيراد بنجاح:\n' + added + ' عميل جديد تمت إضافته';
  if (updated > 0) msg += '\n' + updated + ' عميل موجود تم تحديث بياناته';
  if (skipped > 0) msg += '\n' + skipped + ' صف تم تجاهله (بدون اسم عميل)';
  alert(msg);
}

function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  document.getElementById('root').innerHTML = buildApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function buildFollowupTab(){
  let filtered = transactions.slice();
  if (followupFilter === 'pending') filtered = filtered.filter(t => txPending(t) > 0);
  else if (followupFilter === 'collected') filtered = filtered.filter(t => txPending(t) <= 0);

  const byClient = {};
  filtered.forEach(t => {
    if (!byClient[t.clientId]) byClient[t.clientId] = [];
    byClient[t.clientId].push(t);
  });
  const rows = Object.keys(byClient).map(cid => {
    const c = clients.find(x => x.id === cid);
    const txs = byClient[cid].slice().sort((a,b) => b.date.localeCompare(a.date));
    const totalSent = txs.reduce((s,t) => s + t.amountSent, 0);
    const totalPending = txs.reduce((s,t) => s + txPending(t), 0);
    return {client: c, clientId: cid, txs, totalSent, totalPending};
  }).sort((a,b) => b.totalPending - a.totalPending);

  const grandTotal = followupFilter === 'pending'
    ? filtered.reduce((s,t) => s + txPending(t), 0)
    : filtered.reduce((s,t) => s + txPaid(t), 0);

  return '<div class="section-title">المتابعة</div>'
    + '<div class="segment-row">'
    + '<button class="' + (followupFilter === 'pending' ? 'segment-btn-active' : 'segment-btn') + '" onclick="setFollowupFilter(\'pending\')">لم يتم التحصيل</button>'
    + '<button class="' + (followupFilter === 'collected' ? 'segment-btn-active' : 'segment-btn') + '" onclick="setFollowupFilter(\'collected\')">تم التحصيل</button>'
    + '<button class="' + (followupFilter === 'all' ? 'segment-btn-active' : 'segment-btn') + '" onclick="setFollowupFilter(\'all\')">الكل</button>'
    + '</div>'
    + '<div class="preview-box"><div>عدد المعاملات: <b>' + filtered.length + '</b></div>'
    + '<div>الإجمالي: <b>' + fmtMoney(grandTotal) + '</b></div></div>'
    + (rows.length === 0 ? '<div class="empty-state">لا توجد معاملات مطابقة لهذا الفلتر.</div>' : '')
    + '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">'
    + rows.map(buildFollowupClientCard).join('')
    + '</div>';
}

function buildAreaOptionsForClient(currentLocation){
  let names = sortedAreas().map(a => a.name);
  if (currentLocation && !names.includes(currentLocation)) names = [currentLocation].concat(names);
  let opts = '<option value=""' + (currentLocation ? '' : ' selected') + '>بدون منطقة</option>';
  opts += names.map(n => '<option value="' + esc(n) + '" ' + (n === currentLocation ? 'selected' : '') + '>' + esc(n) + '</option>').join('');
  opts += '<option value="__new__">+ إضافة منطقة جديدة</option>';
  return opts;
}
function handleAreaSelectChange(sel){
  if (sel.value !== '__new__') return;
  const name = prompt('اسم المنطقة الجديدة:');
  if (name && name.trim()) {
    const trimmed = name.trim();
    if (!areas.some(a => a.name === trimmed)) {
      areas.push({id: uid('a'), name: trimmed});
      saveData();
    }
    const opt = document.createElement('option');
    opt.value = trimmed; opt.textContent = trimmed;
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = trimmed;
  } else {
    sel.value = '';
  }
}

  const a = editingAreaId ? areas.find(x => x.id === editingAreaId) : null;
  return '<div class="modal-overlay" onclick="closeAreaModal()"><div class="modal-card" onclick="event.stopPropagation()">'
    + '<div class="modal-head"><div class="modal-title">' + (a ? 'تعديل المنطقة' : 'منطقة جديدة') + '</div>'
    + '<button class="icon-btn" onclick="closeAreaModal()">✕</button></div>'
    + '<label class="field-label">اسم المنطقة</label>'
    + '<input id="af-name" class="select-field" value="' + (a ? esc(a.name) : '') + '" placeholder="مثال: حي الأربعين">'
    + '<button class="export-btn" onclick="saveAreaForm()">✓ حفظ</button>'
    + '</div></div>';
}

/* ---------------- Init ---------------- */
loadData();
render();
refreshMyLocation(true);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js?v=4').catch((e) => console.log('SW registration failed', e));
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
